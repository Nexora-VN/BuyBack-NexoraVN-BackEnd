services:
  postgres:
    image: postgres:18-alpine
    container_name: buyback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buyback
      POSTGRES_USER: buyback
      POSTGRES_PASSWORD: buyback
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - buyback-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buyback -d buyback']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: buyback-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'

  minio:
    image: minio/minio:latest
    container_name: buyback-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - buyback-minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY}; do sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set download local/$${MINIO_BUCKET}/published"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-notebook-lms}
volumes:
  buyback-postgres-data:
  buyback-minio-data:
